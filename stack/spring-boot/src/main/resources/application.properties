server.port=8080

# Database Configuration (MySQL with environment variable override)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/interview_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Where Python feedback service runs
feedback.service.url=${FEEDBACK_SERVICE_URL:http://localhost:8000}

# React dev server origins
feedback.cors.allowed-origins=http://localhost:3000,http://localhost:5173

server.error.include-message=always
